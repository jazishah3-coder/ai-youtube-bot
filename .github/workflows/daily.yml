name: AI YouTube Bot

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng
          pip install requests pillow edge-tts google-api-python-client google-auth google-auth-httplib2

      - name: Create and upload video
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
        run: |
          cat > bot.py <<'PY'
          import os
          import json
          import re
          import time
          import subprocess
          import asyncio
          import xml.etree.ElementTree as ET
          from pathlib import Path

          import requests
          from PIL import Image, ImageDraw, ImageFont
          import edge_tts

          from google.oauth2.credentials import Credentials
          from google.auth.transport.requests import Request
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload

          GEMINI_KEY = os.environ["GEMINI_API_KEY"]
          REFRESH_TOKEN = os.environ["YOUTUBE_REFRESH_TOKEN"]
          CLIENT_ID = os.environ["YOUTUBE_CLIENT_ID"]
          CLIENT_SECRET = os.environ["YOUTUBE_CLIENT_SECRET"]

          NICHE = "viral facts, psychology, money and technology"
          MODEL = "gemini-3.5-flash"
          WORK = Path("output")
          WORK.mkdir(exist_ok=True)

          def get_trends():
              try:
                  r = requests.get(
                      "https://trends.google.com/trending/rss?geo=US",
                      timeout=20
                  )
                  r.raise_for_status()
                  root = ET.fromstring(r.text)
                  topics = []
                  for item in root.findall(".//item"):
                      title = item.find("title")
                      if title is not None and title.text:
                          topics.append(title.text.strip())
                  return topics[:15]
              except Exception as e:
                  print("Trend fetch failed:", e)
                  return []

          def gemini(prompt):
              url = (
                  "https://generativelanguage.googleapis.com/v1beta/models/"
                  f"{MODEL}:generateContent?key={GEMINI_KEY}"
              )
              payload = {
                  "contents": [{"parts": [{"text": prompt}]}]
              }

              last_error = None
              for attempt in range(4):
                  try:
                      r = requests.post(
                          url,
                          headers={"Content-Type": "application/json"},
                          json=payload,
                          timeout=60
                      )
                      if r.status_code in (429, 500, 502, 503):
                          print("Gemini busy:", r.status_code)
                          time.sleep(8 * (attempt + 1))
                          continue
                      r.raise_for_status()
                      return r.json()["candidates"][0]["content"]["parts"][0]["text"]
                  except Exception as e:
                      last_error = e
                      print("Gemini attempt failed:", e)
                      time.sleep(5)

              raise RuntimeError(f"Gemini failed after retries: {last_error}")

