name: AI YouTube Monkey Trading Shorts

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install requests edge-tts google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib

      - name: Create and upload video
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}

        run: |
          cat > bot.py <<'PY'
          import os
          import json
          import asyncio
          import subprocess
          import time
          from pathlib import Path
          from urllib.parse import quote
          from datetime import datetime
          from zoneinfo import ZoneInfo

          import requests
          import edge_tts

          from google.oauth2.credentials import Credentials
          from google.auth.transport.requests import Request
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload

          GEMINI_KEY = os.environ["GEMINI_API_KEY"]
          POLLINATIONS_KEY = os.environ["POLLINATIONS_API_KEY"]

          CLIENT_ID = os.environ["YOUTUBE_CLIENT_ID"]
          CLIENT_SECRET = os.environ["YOUTUBE_CLIENT_SECRET"]
          REFRESH_TOKEN = os.environ["YOUTUBE_REFRESH_TOKEN"]

          TEXT_MODEL = "gemini-3.5-flash-lite"

          OUT = Path("output")
          OUT.mkdir(exist_ok=True)

          TOPICS = [
              "Support aur Resistance",
              "Trend ko pehchan-na",
              "Candlestick basics",
              "Stop Loss",
              "Take Profit",
              "Risk Reward Ratio",
              "Risk Management",
              "Position Sizing",
              "FOMO",
              "Revenge Trading",
              "Overtrading",
              "Trading Psychology",
              "Patience in Trading",
              "Trading Plan",
              "Trading Journal",
              "Breakout",
              "Fake Breakout",
              "Pullback",
              "Retest",
              "Liquidity",
              "Liquidity Sweep",
              "Volume",
              "Moving Average",
              "RSI",
              "MACD",
              "Market Structure",
              "Higher High aur Higher Low",
              "Lower High aur Lower Low",
              "Trendline",
              "Range Market",
              "Consolidation",
              "Entry Confirmation",
              "Multiple Timeframes",
              "Leverage ka Risk",
              "Liquidation",
              "Margin",
              "Spot aur Futures ka farq",
              "Risk per Trade",
              "Win Rate aur Risk Reward",
              "Slippage",
              "Spread",
              "Fear aur Greed",
              "Trading Discipline",
              "News ke waqt Trading",
              "Volatility",
              "Divergence",
              "Scalping",
              "Swing Trading",
              "Backtesting",
              "Paper Trading",
              "Capital Protection",
              "Trading Checklist",
              "Trading Session",
              "Order Block basics",
              "Fair Value Gap basics",
              "Market Psychology",
              "Bad Entry ki Galti",
              "Late Entry ki Galti",
              "Stop Loss ko samajhna",
              "Profit ko protect karna",
              "Loss ko accept karna",
              "Trading mein sabr"
          ]

          def run(cmd):
              subprocess.run(cmd, check=True)

          def gemini_text(prompt):
              url = (
                  "https://generativelanguage.googleapis.com/v1beta/models/"
                  + TEXT_MODEL
                  + ":generateContent?key="
                  + GEMINI_KEY
              )

              payload = {
                  "contents": [
                      {
                          "parts": [
                              {
                                  "text": prompt
                              }
                          ]
                      }
                  ],
                  "generationConfig": {
                      "temperature": 0.95,
                      "responseMimeType": "application/json"
                  }
              }

              last_error = None

              for attempt in range(3):
                  try:
                      response = requests.post(
                          url,
                          json=payload,
                          timeout=180
                      )

                      response.raise_for_status()

                      data = response.json()

                      text = (
                          data["candidates"][0]
                          ["content"]["parts"][0]["text"]
                      )

                      text = (
                          text.replace("```json", "")
                          .replace("```", "")
                          .strip()
                      )

                      return json.loads(text)

                  except Exception as error:
                      last_error = error
                      print(
                          f"Gemini attempt {attempt + 1}/3 failed:",
                          error
                      )

                      if attempt < 2:
                          time.sleep(5)

              raise RuntimeError(
                  f"Gemini failed after 3 attempts: {last_error}"
              )

          def pollinations_image(prompt, filename):

              full_prompt = prompt + """

              Photorealistic cinematic image.
              Vertical 9:16 composition.
              Same young rhesus macaque monkey character.
              Brown-grey realistic fur.
              Expressive dark eyes.
              Small rounded ears.
              Realistic monkey proportions.
              Funny facial expression.
              Funny but believable situation.
              Cinematic lighting.
              Detailed environment.
              Family friendly.
              No text.
              No logo.
              No watermark.
              """

              url = (
                  "https://gen.pollinations.ai/image/"
                  + quote(full_prompt, safe="")
              )

              params = {
                  "model": "flux",
                  "width": 720,
                  "height": 1280
              }

              headers = {
                  "Authorization": "Bearer " + POLLINATIONS_KEY
              }

              for attempt in range(3):

                  try:

                      print(
                          f"Generating image, attempt {attempt + 1}/3..."
                      )

                      response = requests.get(
                          url,
                          params=params,
                          headers=headers,
                          timeout=240
                      )

                      response.raise_for_status()

                      content_type = (
                          response.headers.get(
                              "content-type",
                              ""
                          ).lower()
                      )

                      if "image" not in content_type:
                          raise RuntimeError(
                              "Pollinations did not return an image."
                          )

                      filename.write_bytes(
                          response.content
                      )

                      if filename.stat().st_size < 1000:
                          raise RuntimeError(
                              "Generated image is too small."
                          )

                      return

                  except Exception as error:

                      print(
                          "Image generation failed:",
                          error
                      )

                      if attempt < 2:
                          time.sleep(5)

              raise RuntimeError(
                  f"Pollinations failed for {filename}"
              )

          async def make_voice(text, filename):

              preferred = [
                  "ur-PK-UzmaNeural",
                  "ur-PK-AsadNeural",
                  "hi-IN-MadhurNeural",
                  "hi-IN-SwaraNeural"
              ]

              try:

                  voices = await edge_tts.list_voices()

                  available = [
                      voice["ShortName"]
                      for voice in voices
                      if voice.get("Locale")
                      in ("ur-PK", "hi-IN")
                  ]

              except Exception as error:

                  print(
                      "Voice list failed:",
                      error
                  )

                  available = []

              voice_list = [
                  voice
                  for voice in preferred
                  if voice in available
              ]

              voice_list += [
                  voice
                  for voice in available
                  if voice not in voice_list
              ]

              if not voice_list:
                  voice_list = preferred

              last_error = None

              for voice_name in voice_list:

                  for attempt in range(3):

                      try:

                          print(
                              f"Trying voice {voice_name}, "
                              f"attempt {attempt + 1}/3"
                          )

                          filename.unlink(
                              missing_ok=True
                          )

                          await edge_tts.Communicate(
                              text,
                              voice_name,
                              rate="+3%",
                              pitch="+0Hz"
                          ).save(
                              str(filename)
                          )

                          if (
                              filename.exists()
                              and filename.stat().st_size > 1000
                          ):

                              print(
                                  "Voice created:",
                                  voice_name
                              )

                              return

                      except Exception as error:

                          last_error = error

                          print(
                              "Voice failed:",
                              error
                          )

                          await asyncio.sleep(3)

              raise RuntimeError(
                  f"All Urdu/Hindi voices failed: {last_error}"
              )

          def main():

              pakistan_now = datetime.now(
                  ZoneInfo("Asia/Karachi")
              )

              day_number = (
                  pakistan_now.date().toordinal()
              )

              topic = TOPICS[
                  day_number % len(TOPICS)
              ]

              print(
                  "PAKISTAN DATE:",
                  pakistan_now.strftime("%Y-%m-%d")
              )

              print(
                  "TODAY'S TRADING TOPIC:",
                  topic
              )

              story_prompt = f"""
          Create ONE original funny wholesome YouTube Shorts story.

          TODAY'S FIXED TRADING TOPIC:
          {topic}

          The video must teach this trading topic in a simple,
          entertaining and memorable way.

          Main character:
          The SAME young rhesus macaque monkey in every scene.

          Character:
          brown-grey fur,
          expressive dark eyes,
          small rounded ears,
          realistic proportions,
          slightly mischievous face.

          STORY STYLE:
          Very funny.
          Cute monkey comedy.
          Strong hook at the beginning.
          A funny mistake or misunderstanding.
          Then a simple trading lesson.
          End with a memorable lesson.

          IMPORTANT:
          This is educational content only.

          Do NOT give:
          guaranteed profit,
          guaranteed winning strategy,
          100 percent accuracy claims,
          direct buy or sell signals,
          fake financial promises,
          fake expert claims.

          Do not tell viewers to buy or sell any
          specific coin, stock or financial product.

          LANGUAGE RULE:

          Narration MUST be written completely
          in natural Urdu script.

          Example:
          "بندر نے آج ایک عجیب غلطی کر دی"

          Do NOT write narration in Roman Urdu.

          Do NOT write narration in English.

          The narration should sound natural when spoken
          by a clear Hindi/Urdu voice.

          Title should be catchy and related to trading.
          Title can contain simple English trading words if useful.

          Description should be in Urdu
          with simple trading terms.

          Create exactly 6 scenes.

          Each scene should last exactly 5 seconds.

          Total narration should be short enough
          for about 25 to 30 seconds.

          Narration should be around 65 to 80 Urdu words.

          VISUAL PROMPTS:

          Visual prompts may be written in English.

          They must clearly describe the funny monkey action.

          Do not put text inside images.

          Return ONLY valid JSON.

          Required JSON:

          {{
            "title": "...",
            "description": "...",
            "narration": "...",
            "hashtags": [
              "...",
              "...",
              "...",
              "...",
              "..."
            ],
            "tags": [
              "...",
              "...",
              "...",
              "..."
            ],
            "scenes": [
              {{
                "visual_prompt": "...",
                "duration": 5
              }},
              {{
                "visual_prompt": "...",
                "duration": 5
              }},
              {{
                "visual_prompt": "...",
                "duration": 5
              }},
              {{
                "visual_prompt": "...",
                "duration": 5
              }},
              {{
                "visual_prompt": "...",
                "duration": 5
              }},
              {{
                "visual_prompt": "...",
                "duration": 5
              }}
            ]
          }}
          """

              story = gemini_text(
                  story_prompt
              )

              title = str(
                  story.get("title", "")
              ).strip()

              description = str(
                  story.get("description", "")
              ).strip()

              narration = str(
                  story.get("narration", "")
              ).strip()

              hashtags = story.get(
                  "hashtags",
                  []
              )

              tags = story.get(
                  "tags",
                  []
              )

              scenes = story.get(
                  "scenes",
                  []
              )

              if not title:
                  raise RuntimeError(
                      "Gemini returned an empty title."
                  )

              if not narration:
                  raise RuntimeError(
                      "Gemini returned empty narration."
                  )

              if len(scenes) != 6:
                  raise RuntimeError(
                      "Gemini did not return exactly 6 scenes."
                  )

              urdu_count = sum(
                  1
                  for char in narration
                  if "\u0600" <= char <= "\u06ff"
              )

              if urdu_count < 20:
                  raise RuntimeError(
                      "Narration is not sufficiently Urdu script."
                  )

              print(
                  "TITLE:",
                  title
              )

              print(
                  "NARRATION:",
                  narration
              )

              image_files = []

              for index, scene in enumerate(
                  scenes,
                  1
              ):

                  filename = (
                      OUT / f"scene_{index}.png"
                  )

                  print(
                      f"Generating image {index}/6..."
                  )

                  pollinations_image(
                      str(
                          scene["visual_prompt"]
                      ),
                      filename
                  )

                  image_files.append(
                      filename
                  )

              audio_file = (
                  OUT / "voice.mp3"
              )

              print(
                  "Creating Urdu/Hindi voice..."
              )

              asyncio.run(
                  make_voice(
                      narration,
                      audio_file
                  )
              )

              clips = []

              for index, image in enumerate(
                  image_files,
                  1
              ):

                  clip = (
                      OUT / f"clip_{index}.mp4"
                  )

                  print(
                      f"Creating clip {index}/6..."
                  )

                  run([
                      "ffmpeg",
                      "-y",
                      "-loop",
                      "1",
                      "-i",
                      str(image),
                      "-t",
                      "5",
                      "-vf",
                      "scale=720:1280,"
                      "zoompan="
                      "z='min(zoom+0.0015,1.08)':"
                      "x='iw/2-(iw/zoom/2)':"
                      "y='ih/2-(ih/zoom/2)':"
                      "d=150:"
                      "s=720x1280",
                      "-r",
                      "30",
                      "-pix_fmt",
                      "yuv420p",
                      "-an",
                      str(clip)
                  ])

                  clips.append(
                      clip
                  )

              concat_file = (
                  OUT / "concat.txt"
              )

              with open(
                  concat_file,
                  "w",
                  encoding="utf-8"
              ) as file:

                  for clip in clips:

                      file.write(
                          f"file '{clip.resolve()}'\n"
                      )

              video_file = (
                  OUT / "monkey_trading_short.mp4"
              )

              print(
                  "Combining video and Urdu voice..."
              )

              run([
                  "ffmpeg",
                  "-y",
                  "-f",
                  "concat",
                  "-safe",
                  "0",
                  "-i",
                  str(concat_file),
                  "-i",
                  str(audio_file),
                  "-c:v",
                  "libx264",
                  "-c:a",
                  "aac",
                  "-shortest",
                  "-pix_fmt",
                  "yuv420p",
                  "-movflags",
                  "+faststart",
                  str(video_file)
              ])

              clean_hashtags = []

              for hashtag in hashtags:

                  hashtag = str(
                      hashtag
                  ).strip()

                  if hashtag:

                      if not hashtag.startswith("#"):
                          hashtag = "#" + hashtag

                      if hashtag not in clean_hashtags:
                          clean_hashtags.append(
                              hashtag
                          )

              fixed_hashtags = (
                  "#Trading "
                  "#TradingUrdu "
                  "#TradingEducation "
                  "#TradingPsychology "
                  "#RiskManagement "
                  "#Shorts"
              )

              final_description = (
                  description
                  + "\n\n"
                  + " ".join(
                      clean_hashtags[:8]
                  )
                  + "\n"
                  + fixed_hashtags
              )

              final_tags = [
                  "trading",
                  "trading education",
                  "trading urdu",
                  "trading psychology",
                  "risk management",
                  "monkey trading",
                  "funny monkey",
                  "trading shorts",
                  "shorts"
              ]

              for tag in tags:

                  tag = str(
                      tag
                  ).strip()

                  if (
                      tag
                      and tag not in final_tags
                  ):
                      final_tags.append(
                          tag
                      )

              credentials = Credentials(
                  None,
                  refresh_token=REFRESH_TOKEN,
                  token_uri=(
                      "https://oauth2.googleapis.com/token"
                  ),
                  client_id=CLIENT_ID,
                  client_secret=CLIENT_SECRET
              )

              print(
                  "Refreshing YouTube login..."
              )

              credentials.refresh(
                  Request()
              )

              youtube = build(
                  "youtube",
                  "v3",
                  credentials=credentials
              )

              body = {
                  "snippet": {
                      "title": title[:100],
                      "description": final_description,
                      "tags": final_tags[:40],
                      "categoryId": "24"
                  },
                  "status": {
                      "privacyStatus": "public",
                      "selfDeclaredMadeForKids": False
                  }
              }

              print(
                  "Uploading video to YouTube..."
              )

              media = MediaFileUpload(
                  str(video_file),
                  mimetype="video/mp4",
                  resumable=True
              )

              upload_request = (
                  youtube.videos().insert(
                      part="snippet,status",
                      body=body,
                      media_body=media
                  )
              )

              response = (
                  upload_request.execute()
              )

              video_id = response["id"]

              print(
                  "========================================"
              )

              print(
                  "SUCCESS!"
              )

              print(
                  "YouTube video ID:",
                  video_id
              )

              print(
                  "YouTube URL:",
                  "https://www.youtube.com/watch?v="
                  + video_id
              )

              print(
                  "========================================"
              )

          if __name__ == "__main__":
              main()
          PY

          python bot.py
