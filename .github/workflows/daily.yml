name: AI YouTube Bot

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

jobs:
  daily:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng
          python -m pip install --upgrade pip
          pip install requests pillow edge-tts google-api-python-client google-auth

