name: AI YouTube Bot

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng
          pip install requests pillow edge-tts google-api-python-client google-auth google-auth-httplib2

      - name: Create and upload video
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
        run: |
          cat > bot.py <<'PY'
          import os
          import json
          import re
          import time
          import subprocess
          import asyncio
          import xml.etree.ElementTree as ET
          from pathlib import Path

          import requests
          from PIL import Image, ImageDraw, ImageFont
          import edge_tts

          from google.oauth2.credentials import Credentials
          from google.auth.transport.requests import Request
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload

          GEMINI_KEY = os.environ["GEMINI_API_KEY"]
          REFRESH_TOKEN = os.environ["YOUTUBE_REFRESH_TOKEN"]
          CLIENT_ID = os.environ["YOUTUBE_CLIENT_ID"]
          CLIENT_SECRET = os.environ["YOUTUBE_CLIENT_SECRET"]

          NICHE = "viral facts, psychology, money and technology"
          MODEL = "gemini-3.5-flash"

          WORK = Path("output")
          WORK.mkdir(exist_ok=True)

          def get_trends():
              url = "https://trends.google.com/trending/rss?geo=US"
              try:
                  r = requests.get(url, timeout=20)
                  r.raise_for_status()
                  root = ET.fromstring(r.text)

                  topics = []
                  for item in root.findall(".//item"):
                      title = item.find("title")
                      if title is not None and title.text:
                          topics.append(title.text.strip())

                  return topics[:15]
              except Exception as e:
                  print("Trend fetch failed:", e)
                  return []

          def gemini(prompt):
              url = (
                  f"https://generativelanguage.googleapis.com/v1beta/models/"
                  f"{MODEL}:generateContent?key={GEMINI_KEY}"
              )

              payload = {
                  "contents": [
                      {
                          "parts": [
                              {
                                  "text": prompt
                              }
                          ]
                      }
                  ]
              }

              for attempt in range(4):
                  try:
                      r = requests.post(
                          url,
                          headers={"Content-Type": "application/json"},
                          json=payload,
                          timeout=60
                      )

                      if r.status_code in (429, 500, 502, 503):
                          print("Gemini busy:", r.status_code)
                          time.sleep(8 * (attempt + 1))
                          continue

                      r.raise_for_status()
                      data = r.json()

                      return data["candidates"][0]["content"]["parts"][0]["text"]

                  except Exception as e:
                      print("Gemini attempt failed:", e)
                      time.sleep(5)

              raise RuntimeError("Gemini failed after retries")

          def clean_json(text):
              text = text.strip()
              text = re.sub(r"^```json\s*", "", text)
              text = re.sub(r"^```\s*", "", text)
              text = re.sub(r"\s*```$", "", text)

              start = text.find("{")
              end = text.rfind("}")

              if start == -1 or end == -1:
                  raise ValueError("No JSON found")

              return json.loads(text[start:end + 1])

          trends = get_trends()

          trend_text = ", ".join(trends) if trends else "No trend list available"

          prompt = f"""
          You are an expert viral YouTube Shorts/short-video creator.

          Channel niche:
          {NICHE}

          Current trending topics:
          {trend_text}

          Choose ONE interesting topic that has strong viral potential.
          Avoid politics, religion, medical misinformation, and copyrighted stories.

          Create a complete 60-90 second English YouTube video.

          Return ONLY valid JSON in exactly this structure:

          {{
            "title": "short clickable YouTube title",
            "description": "YouTube description with a strong hook and call to action",
            "hashtags": ["#example", "#example2", "#example3"],
            "tags": ["tag1", "tag2", "tag3", "tag4", "tag5"],
            "script": "natural spoken narration around 180-220 words",
            "slides": [
              "short text for slide 1",
              "short text for slide 2",
              "short text for slide 3",
              "short text for slide 4",
              "short text for slide 5",
              "short text for slide 6"
            ]
          }}

          Make the narration engaging from the first sentence.
          Do not mention that AI wrote the video.
          Do not use fake statistics.
          """

          raw = gemini(prompt)
          data = clean_json(raw)

          title = data["title"].strip()
          description = data["description"].strip()
          script = data["script"].strip()
          slides = data["slides"]

          hashtags = data.get("hashtags", [])
          tags = data.get("tags", [])

          print("TITLE:", title)
          print("SCRIPT:", script)

          (WORK / "script.txt").write_text(script, encoding="utf-8")

          async def make_voice():
              try:
                  communicate = edge_tts.Communicate(
                      script,
                      "en-US-AriaNeural"
                  )
                  await communicate.save(str(WORK / "voice.mp3"))
                  return True
              except Exception as e:
                  print("Edge TTS failed:", e)
                  return False

          tts_ok = asyncio.run(make_voice())

          if not tts_ok:
              wav = WORK / "voice.wav"
              subprocess.run(
                  [
                      "espeak-ng",
                      "-s", "155",
                      "-v", "en-us",
                      "-w", str(wav),
                      script
                  ],
                  check=True
              )

              subprocess.run(
                  [
                      "ffmpeg", "-y",
                      "-i", str(wav),
                      str(WORK / "voice.mp3")
                  ],
                  check=True
              )

          font_bold = "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf"
          font_regular = "/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf"

          def wrap_text(draw, text, font, max_width):
              words = text.split()
              lines = []
              current = ""

              for word in words:
                  test = current + (" " if current else "") + word
                  box = draw.textbbox((0, 0), test, font=font)

                  if box[2] <= max_width:
                      current = test
                  else:
                      if current:
                          lines.append(current)
                      current = word

              if current:
                  lines.append(current)

              return lines

          def make_slide(text, number):
              img = Image.new("RGB", (1920, 1080), (18, 18, 28))
              draw = ImageDraw.Draw(img)

              for y in range(1080):
                  shade = int(18 + (y / 1080) * 25)
                  draw.line((0, y, 1920, y), fill=(shade, shade, shade + 8))

              title_font = ImageFont.truetype(font_bold, 70)
              body_font = ImageFont.truetype(font_regular, 48)
              small_font = ImageFont.truetype(font_bold, 32)

              title_lines = wrap_text(
                  draw,
                  title,
                  title_font,
                  1650
              )

              y = 120

              for line in title_lines[:2]:
                  box = draw.textbbox((0, 0), line, font=title_font)
                  w = box[2] - box[0]

                  draw.text(
                      ((1920 - w) / 2, y),
                      line,
                      font=title_font,
                      fill=(255, 255, 255)
                  )

                  y += 90

              body_lines = wrap_text(
                  draw,
                  text,
                  body_font,
                  1500
              )

              y = 470

              for line in body_lines[:6]:
                  box = draw.textbbox((0, 0), line, font=body_font)
                  w = box[2] - box[0]

                  draw.text(
                      ((1920 - w) / 2, y),
                      line,
                      font=body_font,
                      fill=(220, 220, 220)
                  )

                  y += 65

              footer = f"{number}/6"
              draw.text(
                  (1750, 1000),
                  footer,
                  font=small_font,
                  fill=(180, 180, 180)
              )

              path = WORK / f"slide_{number}.png"
              img.save(path)
              return path

          slide_paths = []

          for i, slide_text in enumerate(slides[:6], start=1):
              slide_paths.append(
                  make_slide(str(slide_text), i)
              )

          result = subprocess.run(
              [
                  "ffprobe",
                  "-v", "error",
                  "-show_entries", "format=duration",
                  "-of", "default=noprint_wrappers=1:nokey=1",
                  str(WORK / "voice.mp3")
              ],
              capture_output=True,
              text=True,
              check=True
          )

          audio_duration = float(result.stdout.strip())
          slide_duration = max(1.0, audio_duration / len(slide_paths))

          concat_file = WORK / "slides.txt"

          with open(concat_file, "w", encoding="utf-8") as f:
              for path in slide_paths:
                  f.write(f"file '{path.resolve()}'\n")
                  f.write(f"duration {slide_duration}\n")

              f.write(f"file '{slide_paths[-1].resolve()}'\n")

          video_path = WORK / "video.mp4"

          subprocess.run(
              [
                  "ffmpeg", "-y",
                  "-f", "concat",
                  "-safe", "0",
                  "-i", str(concat_file),
                  "-i", str(WORK / "voice.mp3"),
                  "-c:v", "libx264",
                  "-preset", "veryfast",
                  "-pix_fmt", "yuv420p",
                  "-c:a", "aac",
                  "-b:a", "128k",
                  "-shortest",
                  str(video_path)
              ],
              check=True
          )

          thumb = Image.new("RGB", (1280, 720), (15, 15, 20))
          draw = ImageDraw.Draw(thumb)

          thumb_font = ImageFont.truetype(font_bold, 72)
          small_font = ImageFont.truetype(font_regular, 30)

          title_lines = wrap_text(
              draw,
              title.upper(),
              thumb_font,
              1080
          )

          y = 170

          for line in title_lines[:4]:
              box = draw.textbbox((0, 0), line, font=thumb_font)
              w = box[2] - box[0]

              draw.text(
                  ((1280 - w) / 2, y),
                  line,
                  font=thumb_font,
                  fill=(255, 255, 255)
              )

              y += 85

          draw.text(
              (40, 650),
              "WATCH TILL THE END",
              font=small_font,
              fill=(210, 210, 210)
          )

          thumbnail_path = WORK / "thumbnail.png"
          thumb.save(thumbnail_path)

          # YouTube authentication
          scopes = ["https://www.googleapis.com/auth/youtube.upload"]

          credentials = Credentials(
              token=None,
              refresh_token=REFRESH_TOKEN,
              token_uri="https://oauth2.googleapis.com/token",
              client_id=CLIENT_ID,
              client_secret=CLIENT_SECRET,
              scopes=scopes
          )

          try:
              credentials.refresh(Request())
          except Exception as first_error:
              print("YouTube token refresh failed:", first_error)
              print("Retrying without client secret...")

              credentials = Credentials(
                  token=None,
                  refresh_token=REFRESH_TOKEN,
                  token_uri="https://oauth2.googleapis.com/token",
                  client_id=CLIENT_ID,
                  client_secret=None,
                  scopes=scopes
              )
              credentials.refresh(Request())

          youtube = build(
              "youtube",
              "v3",
              credentials=credentials
          )

          clean_tags = []

          for tag in tags:
              tag = str(tag).strip()
              if tag:
                  clean_tags.append(tag)

          body = {
              "snippet": {
                  "title": title[:100],
                  "description": (
                      description
                      + "\n\n"
                      + " ".join(hashtags)
                  )[:5000],
                  "tags": clean_tags[:30],
                  "categoryId": "27"
              },
              "status": {
                  "privacyStatus": "public",
                  "selfDeclaredMadeForKids": False
              }
          }

          print("Uploading video to YouTube...")

          upload = youtube.videos().insert(
              part="snippet,status",
              body=body,
              media_body=MediaFileUpload(
                  str(video_path),
                  mimetype="video/mp4",
                  resumable=True
              )
          )

          response = upload.execute()
          video_id = response["id"]

          print("VIDEO UPLOADED:", video_id)
          print("https://www.youtube.com/watch?v=" + video_id)

          try:
              youtube.thumbnails().set(
                  videoId=video_id,
                  media_body=MediaFileUpload(
                      str(thumbnail_path),
                      mimetype="image/png"
                  )
              ).execute()

              print("Thumbnail uploaded successfully.")

          except Exception as e:
              print("Thumbnail upload skipped:", e)

          print("AI YouTube Bot completed successfully.")

          PY

          python bot.py
