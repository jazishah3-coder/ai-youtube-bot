name: AI YouTube Monkey Trading Shorts

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install requests edge-tts google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib

      - name: Create and upload video
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}

        run: |
          cat > bot.py <<'PY'
          import os
          import json
          import asyncio
          import subprocess
          import time
          from pathlib import Path
          from urllib.parse import quote
          from datetime import datetime
          from zoneinfo import ZoneInfo

          import requests
          import edge_tts

          from google.oauth2.credentials import Credentials
          from google.auth.transport.requests import Request
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload


          # ============================================================
          # KEYS
          # ============================================================

          GEMINI_KEY = os.environ["GEMINI_API_KEY"]
          POLLINATIONS_KEY = os.environ["POLLINATIONS_API_KEY"]

          CLIENT_ID = os.environ["YOUTUBE_CLIENT_ID"]
          CLIENT_SECRET = os.environ["YOUTUBE_CLIENT_SECRET"]
          REFRESH_TOKEN = os.environ["YOUTUBE_REFRESH_TOKEN"]


          # ============================================================
          # SETTINGS
          # ============================================================

          TEXT_MODEL = "gemini-3.5-flash-lite"

          # Clear Urdu/Hindi-style Urdu voice
          VOICE = "ur-PK-AsadNeural"

          OUT = Path("output")
          OUT.mkdir(exist_ok=True)


          # ============================================================
          # DAILY TRADING TOPICS
          # ============================================================

          TRADING_TOPICS = [
              "FOMO اور جلد بازی میں ٹریڈ کرنا",
              "Stop Loss کی اہمیت",
              "Take Profit کیا ہوتا ہے",
              "Support اور Resistance",
              "Trend کو پہچاننا",
              "Breakout اور Fake Breakout",
              "Pullback کیا ہوتا ہے",
              "Risk Management",
              "Risk Reward Ratio",
              "Position Size",
              "Overtrading کا نقصان",
              "Revenge Trading",
              "Trading Psychology",
              "Fear اور Greed",
              "Patience in Trading",
              "Trading Plan",
              "Trading Journal",
              "Candlestick Patterns",
              "Market Structure",
              "Higher High اور Higher Low",
              "Lower High اور Lower Low",
              "Resistance کا Support بننا",
              "Support کا Resistance بننا",
              "Entry Confirmation",
              "Multiple Timeframes",
              "Leverage کا خطرہ",
              "Liquidation کیا ہوتی ہے",
              "Margin کیا ہوتا ہے",
              "Spot اور Futures کا فرق",
              "Risk Per Trade",
              "Win Rate اور Risk Reward",
              "Spread کیا ہوتا ہے",
              "Slippage کیا ہوتا ہے",
              "News کے وقت Trading",
              "Consolidation Market",
              "Range Market",
              "Trendline",
              "Volume",
              "Volume Breakout",
              "RSI کا بنیادی استعمال",
              "Moving Average",
              "MACD کا بنیادی تصور",
              "Divergence",
              "Retest",
              "Scalping اور Swing Trading",
              "Backtesting",
              "Paper Trading",
              "Capital Protection",
              "Trading Checklist",
              "Liquidity",
              "Liquidity Sweep",
              "Order Block کا بنیادی تصور",
              "Fair Value Gap کا بنیادی تصور",
              "False Signal سے بچنا",
              "Confirmation کا انتظار",
              "Small Loss قبول کرنا",
              "Discipline",
              "Trading میں صبر",
              "ایک وقت میں ایک اچھی Setup",
              "Guaranteed Profit کے جھوٹ سے بچنا"
          ]


          # Pakistan date کے حساب سے topic rotate ہوگا۔
          pakistan_now = datetime.now(
              ZoneInfo("Asia/Karachi")
          )

          day_number = pakistan_now.date().toordinal()

          selected_topic = TRADING_TOPICS[
              day_number % len(TRADING_TOPICS)
          ]

          print("========================================")
          print("Pakistan Date:", pakistan_now.date())
          print("Today's Trading Topic:", selected_topic)
          print("========================================")


          # ============================================================
          # COMMAND RUNNER
          # ============================================================

          def run(cmd):
              print("Running:", " ".join(map(str, cmd)))
              subprocess.run(cmd, check=True)


          # ============================================================
          # GEMINI TEXT
          # ============================================================

          def gemini_text(prompt):

              url = (
                  "https://generativelanguage.googleapis.com/v1beta/models/"
                  + TEXT_MODEL
                  + ":generateContent?key="
                  + GEMINI_KEY
              )

              payload = {
                  "contents": [
                      {
                          "parts": [
                              {
                                  "text": prompt
                              }
                          ]
                      }
                  ],
                  "generationConfig": {
                      "temperature": 0.9,
                      "responseMimeType": "application/json"
                  }
              }

              response = requests.post(
                  url,
                  json=payload,
                  timeout=180
              )

              response.raise_for_status()

              data = response.json()

              text = (
                  data["candidates"][0]
                  ["content"]["parts"][0]["text"]
              )

              text = (
                  text.replace("```json", "")
                  .replace("```", "")
                  .strip()
              )

              return json.loads(text)


          # ============================================================
          # POLLINATIONS IMAGE
          # ============================================================

          def pollinations_image(prompt, filename):

              full_prompt = prompt + """
              Photorealistic cinematic scene.
              Vertical 9:16 composition.
              Same young rhesus macaque monkey character.
              Brown-grey realistic fur.
              Expressive dark eyes.
              Small rounded ears.
              Realistic body proportions.
              Funny facial expression.
              Natural cinematic lighting.
              Detailed realistic environment.
              Family friendly.
              No readable text.
              No logo.
              No watermark.
              No real person.
              """

              encoded = quote(full_prompt, safe="")

              url = (
                  "https://gen.pollinations.ai/image/"
                  + encoded
              )

              params = {
                  "model": "flux",
                  "width": 720,
                  "height": 1280
              }

              headers = {
                  "Authorization":
                      "Bearer " + POLLINATIONS_KEY
              }

              for attempt in range(3):

                  try:

                      response = requests.get(
                          url,
                          params=params,
                          headers=headers,
                          timeout=240
                      )

                      response.raise_for_status()

                      content_type = (
                          response.headers.get(
                              "content-type",
                              ""
                          ).lower()
                      )

                      if "image" not in content_type:
                          raise RuntimeError(
                              "Pollinations did not return an image."
                          )

                      filename.write_bytes(
                          response.content
                      )

                      print(
                          "Image saved:",
                          filename
                      )

                      return

                  except Exception as error:

                      print(
                          "Image attempt failed:",
                          attempt + 1,
                          error
                      )

                      if attempt == 2:
                          raise

                      time.sleep(5)


          # ============================================================
          # URDU VOICE
          # ============================================================

          async def make_voice(text, filename):

              communicate = edge_tts.Communicate(
                  text=text,
                  voice=VOICE,
                  rate="+0%",
                  volume="+0%",
                  pitch="+0Hz"
              )

              await communicate.save(
                  str(filename)
              )


          # ============================================================
          # MAIN
          # ============================================================

          def main():

              story_prompt = f"""
              آج کی تاریخ پاکستان کے مطابق:
              {pakistan_now.strftime("%Y-%m-%d")}

              آج کا لازمی Trading Topic:
              {selected_topic}

              ایک بہت مزاحیہ، دلچسپ اور family-friendly
              YouTube Shorts story بناؤ۔

              Main character:
              SAME young rhesus macaque monkey in all 6 scenes.

              Monkey appearance:
              brown-grey fur,
              expressive dark eyes,
              small rounded ears,
              realistic proportions,
              mischievous funny face.

              STORY STYLE:

              Story بہت funny ہو۔

              پہلے 2 سے 3 سیکنڈ میں strong funny hook ہو۔

              بندر trading کے دوران کوئی مزاحیہ غلطی کرے۔

              پھر اس غلطی سے ایک دلچسپ situation پیدا ہو۔

              آخر میں اسی Trading Topic کا آسان سا
              educational lesson دیا جائے۔

              Story boring lecture نہیں ہونی چاہیے۔

              Comedy + story + trading lesson لازمی ہو۔

              مثال کے طور پر:
              بندر FOMO میں جلدی entry لے لیتا ہے،
              پھر market الٹی طرف چلی جاتی ہے،
              بندر کا funny reaction آتا ہے،
              آخر میں اسے سمجھ آتی ہے کہ confirmation
              اور risk management ضروری ہیں۔

              لیکن ہر دن نئی story اور نیا scenario بناؤ۔

              FINANCIAL SAFETY:

              کوئی guaranteed profit نہ کہنا۔

              "100% profit" نہ کہنا۔

              "100% win" نہ کہنا۔

              کسی کو specific buy/sell signal نہ دینا۔

              کسی coin یا stock کو guaranteed winner نہ کہنا۔

              صرف educational trading lesson دینا۔

              LANGUAGE:

              narration مکمل قدرتی اردو رسم الخط میں ہو۔

              Roman Urdu استعمال نہ کرو۔

              Narration میں غیر ضروری English جملے نہ ہوں۔

              Trading کے عام terms جیسے FOMO,
              Stop Loss, Support, Resistance وغیرہ
              ضرورت کے مطابق English میں رہ سکتے ہیں۔

              Voice ایسی لگنی چاہیے جیسے صاف اور قدرتی
              Hindi/Urdu storytelling ہو۔

              Narration تقریباً 65 سے 80 الفاظ کی ہو
              تاکہ تقریباً 30 second Short میں fit ہو۔

              TITLE:

              Title funny اور curiosity والا ہو۔

              Trading topic واضح ہو۔

              Title زیادہ سے زیادہ تقریباً 80 characters کا ہو۔

              DESCRIPTION:

              مختصر Urdu description بناؤ۔

              HASHTAGS:

              6 سے 10 relevant trading hashtags دو۔

              مثال:
              #Trading
              #TradingUrdu
              #TradingPsychology
              #RiskManagement
              #TradingEducation
              #Shorts

              TAGS:

              YouTube کے لیے relevant trading tags دو۔

              SCENES:

              Exactly 6 scenes بناؤ۔

              ہر scene تقریباً 5 seconds کا ہو۔

              Scene structure:

              Scene 1:
              Funny hook.

              Scene 2:
              Trading problem شروع۔

              Scene 3:
              Funny mistake یا unexpected situation۔

              Scene 4:
              Problem کا result۔

              Scene 5:
              Monkey صحیح trading concept سمجھتا ہے۔

              Scene 6:
              Funny ending + simple lesson۔

              IMPORTANT:

              visual_prompt English میں لکھو تاکہ image generation بہتر ہو۔

              visual_prompt میں scene کا action,
              monkey expression,
              environment اور cinematic details واضح ہوں۔

              Return ONLY valid JSON.

              JSON format:

              {{
                "title": "...",
                "description": "...",
                "narration": "...",
                "hashtags": [
                  "#Trading",
                  "#TradingUrdu"
                ],
                "tags": [
                  "trading",
                  "trading education"
                ],
                "scenes": [
                  {{
                    "visual_prompt": "...",
                    "duration": 5
                  }},
                  {{
                    "visual_prompt": "...",
                    "duration": 5
                  }},
                  {{
                    "visual_prompt": "...",
                    "duration": 5
                  }},
                  {{
                    "visual_prompt": "...",
                    "duration": 5
                  }},
                  {{
                    "visual_prompt": "...",
                    "duration": 5
                  }},
                  {{
                    "visual_prompt": "...",
                    "duration": 5
                  }}
                ]
              }}
              """

              print("Creating today's funny trading story...")

              story = gemini_text(
                  story_prompt
              )

              title = str(
                  story["title"]
              ).strip()

              description = str(
                  story["description"]
              ).strip()

              narration = str(
                  story["narration"]
              ).strip()

              hashtags = story.get(
                  "hashtags",
                  []
              )

              tags = story.get(
                  "tags",
                  []
              )

              scenes = story["scenes"]

              if len(scenes) != 6:
                  raise RuntimeError(
                      "Gemini did not create exactly 6 scenes."
                  )

              if len(narration) < 80:
                  raise RuntimeError(
                      "Narration is too short."
                  )

              # Ensure Urdu script exists.
              urdu_chars = sum(
                  1
                  for char in narration
                  if "\u0600" <= char <= "\u06FF"
              )

              if urdu_chars < 20:
                  raise RuntimeError(
                      "Narration was not generated in Urdu script."
                  )

              print("========================================")
              print("TITLE:")
              print(title)
              print("----------------------------------------")
              print("NARRATION:")
              print(narration)
              print("========================================")


              # ========================================================
              # GENERATE 6 IMAGES
              # ========================================================

              image_files = []

              for i, scene in enumerate(scenes):

                  filename = (
                      OUT / f"scene_{i + 1}.png"
                  )

                  print(
                      f"Generating image {i + 1} of 6..."
                  )

                  pollinations_image(
                      scene["visual_prompt"],
                      filename
                  )

                  image_files.append(
                      filename
                  )


              # ========================================================
              # CREATE URDU VOICE
              # ========================================================

              audio_file = (
                  OUT / "voice.mp3"
              )

              print(
                  "Creating clear Urdu/Hindi-style voice..."
              )

              asyncio.run(
                  make_voice(
                      narration,
                      audio_file
                  )
              )


              # ========================================================
              # CREATE VIDEO CLIPS
              # ========================================================

              clips = []

              for i, image in enumerate(
                  image_files
              ):

                  clip = (
                      OUT / f"clip_{i + 1}.mp4"
                  )

                  print(
                      f"Creating video clip {i + 1}..."
                  )

                  run([
                      "ffmpeg",
                      "-y",
                      "-loop",
                      "1",
                      "-i",
                      str(image),
                      "-t",
                      "5",
                      "-vf",
                      "scale=720:1280,"
                      "zoompan="
                      "z='min(zoom+0.0015,1.08)':"
                      "x='iw/2-(iw/zoom/2)':"
                      "y='ih/2-(ih/zoom/2)':"
                      "d=150:"
                      "s=720x1280",
                      "-r",
                      "30",
                      "-pix_fmt",
                      "yuv420p",
                      "-an",
                      str(clip)
                  ])

                  clips.append(
                      clip
                  )


              # ========================================================
              # CONCATENATE VIDEO
              # ========================================================

              concat_file = (
                  OUT / "concat.txt"
              )

              with open(
                  concat_file,
                  "w",
                  encoding="utf-8"
