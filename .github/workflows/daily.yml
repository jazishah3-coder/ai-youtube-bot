name: AI YouTube Monkey Shorts

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install requests edge-tts google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib

      - name: Generate Monkey Short and Upload
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          cat > bot.py <<'PY'
          import os
          import json
          import base64
          import asyncio
          import subprocess
          from pathlib import Path

          import requests
          import edge_tts

          from google.oauth2.credentials import Credentials
          from google.auth.transport.requests import Request
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload

          GEMINI_KEY = os.environ["GEMINI_API_KEY"]
          CLIENT_ID = os.environ["YOUTUBE_CLIENT_ID"]
          CLIENT_SECRET = os.environ["YOUTUBE_CLIENT_SECRET"]
          REFRESH_TOKEN = os.environ["YOUTUBE_REFRESH_TOKEN"]

          TEXT_MODEL = "gemini-3.5-flash-lite"
          IMAGE_MODEL = "gemini-3.1-flash-image"

          OUT = Path("output")
          OUT.mkdir(exist_ok=True)

          def run(cmd):
              subprocess.run(cmd, check=True)

          def gemini_text(prompt):
              url = (
                  "https://generativelanguage.googleapis.com/v1beta/models/"
                  + TEXT_MODEL
                  + ":generateContent?key="
                  + GEMINI_KEY
              )

              payload = {
                  "contents": [
                      {
                          "parts": [
                              {
                                  "text": prompt
                              }
                          ]
                      }
                  ],
                  "generationConfig": {
                      "temperature": 0.9,
                      "responseMimeType": "application/json"
                  }
              }

              r = requests.post(
                  url,
                  json=payload,
                  timeout=180
              )
              r.raise_for_status()

              data = r.json()

              text = (
                  data["candidates"][0]
                  ["content"]["parts"][0]["text"]
              )

              return json.loads(
                  text.replace("```json", "")
                      .replace("```", "")
                      .strip()
              )

          def gemini_image(prompt, filename):
              url = (
                  "https://generativelanguage.googleapis.com/v1beta/models/"
                  + IMAGE_MODEL
                  + ":generateContent?key="
                  + GEMINI_KEY
              )

              full_prompt = prompt + """
              Photorealistic cinematic image.
              Vertical 9:16 composition.
              Realistic monkey fur and natural human-like emotions.
              Detailed environment.
              Natural lighting.
              No text.
              No logo.
              No watermark.
              """

              payload = {
                  "contents": [
                      {
                          "parts": [
                              {
                                  "text": full_prompt
                              }
                          ]
                      }
                  ],
                  "generationConfig": {
                      "responseModalities": ["IMAGE"],
                      "imageConfig": {
                          "aspectRatio": "9:16",
                          "imageSize": "1K"
                      }
                  }
              }

              r = requests.post(
                  url,
                  json=payload,
                  timeout=240
              )

              r.raise_for_status()

              data = r.json()

              for candidate in data.get("candidates", []):
                  parts = (
                      candidate
                      .get("content", {})
                      .get("parts", [])
                  )

                  for part in parts:
                      inline = (
                          part.get("inlineData")
                          or part.get("inline_data")
                      )

                      if inline and inline.get("data"):
                          raw = base64.b64decode(
                              inline["data"]
                          )

                          filename.write_bytes(raw)
                          return

              raise RuntimeError(
                  "Gemini did not return an image."
              )

          async def make_voice(text, filename):
              voice = edge_tts.Communicate(
                  text,
                  "ur-PK-AsadNeural",
                  rate="+5%"
              )

              await voice.save(str(filename))

          def main():

              story_prompt = """
              Create ONE original funny wholesome YouTube Shorts story.

              Main character:
              the SAME young rhesus macaque monkey in every scene.

              Character appearance:
              brown-grey fur, expressive dark eyes,
              small rounded ears, realistic proportions,
              slightly mischievous face.

              The story must be funny, emotional and family friendly.

              Create exactly 6 scenes.

              Return ONLY valid JSON with these fields:

              {
                "title": "...",
                "description": "...",
                "narration": "...",
                "hashtags": ["..."],
                "tags": ["..."],
                "scenes": [
                  {
                    "visual_prompt": "...",
                    "caption": "..."
                  }
                ]
              }

              Rules:

              - Narration must be 110-150 words.
              - Narration must be natural Roman Urdu/Hinglish.
              - Start with a strong hook.
              - Make the story feel like a viral Pakistani Shorts story.
              - Each scene should continue the same story.
              - Exactly 6 scenes.
              - Every visual prompt must repeat the exact monkey
                character description.
              - Images must look photorealistic.
              - No real people.
              - No celebrities.
              - No brands.
              - No copyrighted characters.
              - No politics.
              - No gore.
              - No sexual content.
              - No dangerous instructions.
              """

              print("Creating story...")

              story = gemini_text(story_prompt)

              print("TITLE:")
              print(story["title"])

              scenes = story["scenes"]

              if len(scenes) != 6:
                  raise RuntimeError(
                      "Gemini did not create exactly 6 scenes."
                  )

              images = []

              for i, scene in enumerate(scenes):

                  filename = OUT / (
                      "scene_" + str(i + 1) + ".png"
                  )

                  print(
                      "Generating image",
                      i + 1,
                      "of 6..."
                  )

                  gemini_image(
                      scene["visual_prompt"],
                      filename
                  )

                  images.append(filename)

              audio = OUT / "voice.mp3"

              print("Creating Urdu voice...")

              asyncio.run(
                  make_voice(
                      story["narration"],
                      audio
                  )
              )

              segments = []

              print("Creating cinematic video...")

              for i, image in enumerate(images):

                  segment = OUT / (
                      "segment_" + str(i + 1) + ".mp4"
                  )

                  filter_video = (
                      "scale=720:1280:"
                      "force_original_aspect_ratio=increase,"
                      "crop=720:1280,"
                      "zoompan="
                      "z='min(zoom+0.0008,1.08)':"
                      "d=150:"
                      "s=720x1280:"
                      "fps=30,"
                      "format=yuv420p"
                  )

                  run([
                      "ffmpeg",
                      "-y",
                      "-loop",
                      "1",
                      "-i",
                      str(image),
                      "-vf",
                      filter_video,
                      "-t",
                      "5",
                      "-an",
                      "-c:v",
                      "libx264",
                      "-preset",
                      "veryfast",
                      "-pix_fmt",
                      "yuv420p",
                      str(segment)
                  ])

                  segments.append(segment)

              concat_file = OUT / "concat.txt"

              with concat_file.open(
                  "w",
                  encoding="utf-8"
              ) as f:

                  for segment in segments:
                      f.write(
                          "file '"
                          + str(segment.resolve())
                          + "'\n"
                      )

              silent_video = OUT / "silent.mp4"

              run([
                  "ffmpeg",
                  "-y",
                  "-f",
                  "concat",
                  "-safe",
                  "0",
                  "-i",
                  str(concat_file),
                  "-c",
                  "copy",
                  str(silent_video)
              ])

              final_video = OUT / "monkey_short.mp4"

              run([
                  "ffmpeg",
                  "-y",
                  "-i",
                  str(silent_video),
                  "-i",
                  str(audio),
                  "-map",
                  "0:v:0",
                  "-map",
                  "1:a:0",
                  "-c:v",
                  "copy",
                  "-c:a",
                  "aac",
                  "-shortest",
                  str(final_video)
              ])

              print("Authorizing YouTube...")

              credentials = Credentials(
                  None,
                  refresh_token=REFRESH_TOKEN,
                  token_uri="https://oauth2.googleapis.com/token",
                  client_id=CLIENT_ID,
                  client_secret=CLIENT_SECRET,
                  scopes=[
                      "https://www.googleapis.com/auth/youtube.upload"
                  ]
              )

              credentials.refresh(Request())

              youtube = build(
                  "youtube",
                  "v3",
                  credentials=credentials
              )

              description = story.get(
                  "description",
                  ""
              )

              hashtags = story.get(
                  "hashtags",
                  []
              )

              if hashtags:
                  description += (
                      "\n\n"
                      + " ".join(hashtags[:10])
                  )

              body = {
                  "snippet": {
                      "title": story["title"][:100],
                      "description": description[:5000],
                      "tags": story.get(
                          "tags",
                          []
                      )[:30],
                      "categoryId": "24"
                  },
                  "status": {
                      "privacyStatus": "public",
                      "selfDeclaredMadeForKids": False
                  }
              }

              print("Uploading to YouTube...")

              media = MediaFileUpload(
                  str(final_video),
                  mimetype="video/mp4",
                  resumable=True
              )

              request = youtube.videos().insert(
                  part="snippet,status",
                  body=body,
                  media_body=media
              )

              response = None

              while response is None:

                  status, response = (
                      request.next_chunk()
                  )

                  if status:
                      print(
                          "Upload:",
                          int(status.progress() * 100),
                          "%"
                      )

              video_id = response["id"]

              print("")
              print("================================")
              print("VIDEO UPLOADED SUCCESSFULLY")
              print(
                  "https://www.youtube.com/watch?v="
                  + video_id
              )
              print("================================")

          if __name__ == "__main__":
              main()
          PY

          python bot.py

      - name: Save generated files
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: monkey-youtube-output
          path: output/
          if-no-files-found: warn
