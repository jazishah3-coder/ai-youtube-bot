name: AI YouTube Monkey Trading Shorts

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install requests edge-tts google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib

      - name: Create and upload video
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}

        run: |
          cat > bot.py <<'PY'
          import os
          import json
          import asyncio
          import subprocess
          import time
          from pathlib import Path
          from urllib.parse import quote
          from datetime import datetime
          from zoneinfo import ZoneInfo

          import requests
          import edge_tts

          from google.oauth2.credentials import Credentials
          from google.auth.transport.requests import Request
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload


          GEMINI_KEY = os.environ["GEMINI_API_KEY"]
          POLLINATIONS_KEY = os.environ["POLLINATIONS_API_KEY"]

          CLIENT_ID = os.environ["YOUTUBE_CLIENT_ID"]
          CLIENT_SECRET = os.environ["YOUTUBE_CLIENT_SECRET"]
          REFRESH_TOKEN = os.environ["YOUTUBE_REFRESH_TOKEN"]

          TEXT_MODEL = "gemini-3.5-flash-lite"

          OUT = Path("output")
          OUT.mkdir(exist_ok=True)


          TOPICS = [
              "Support aur Resistance",
              "Trend ko pehchan-na",
              "Candlestick basics",
              "Stop Loss",
              "Take Profit",
              "Risk Reward Ratio",
              "Risk Management",
              "Position Sizing",
              "FOMO",
              "Revenge Trading",
              "Overtrading",
              "Trading Psychology",
              "Patience in Trading",
              "Trading Plan",
              "Trading Journal",
              "Breakout",
              "Fake Breakout",
              "Pullback",
              "Retest",
              "Liquidity",
              "Liquidity Sweep",
              "Volume",
              "Moving Average",
              "RSI",
              "MACD",
              "Market Structure",
              "Higher High aur Higher Low",
              "Lower High aur Lower Low",
              "Trendline",
              "Range Market",
              "Consolidation",
              "Entry Confirmation",
              "Multiple Timeframes",
              "Leverage ka Risk",
              "Liquidation",
              "Margin",
              "Spot aur Futures ka farq",
              "Risk per Trade",
              "Win Rate aur Risk Reward",
              "Slippage",
              "Spread",
              "Fear aur Greed",
              "Trading Discipline",
              "News ke waqt Trading",
              "Volatility",
              "Divergence",
              "Scalping",
              "Swing Trading",
              "Backtesting",
              "Paper Trading",
              "Capital Protection",
              "Trading Checklist",
              "Trading Session",
              "Order Block basics",
              "Fair Value Gap basics",
              "Market Psychology",
              "Bad Entry ki Galti",
              "Late Entry ki Galti",
              "Stop Loss ko samajhna",
              "Profit ko protect karna",
              "Loss ko accept karna",
              "Trading mein sabr"
          ]


          def run(cmd):
              subprocess.run(cmd, check=True)


          def gemini_text(prompt):
              url = (
                  "https://generativelanguage.googleapis.com/v1beta/models/"
                  + TEXT_MODEL
                  + ":generateContent?key="
                  + GEMINI_KEY
              )

              payload = {
                  "contents": [
                      {
                          "parts": [
                              {
                                  "text": prompt
                              }
                          ]
                      }
                  ],
                  "generationConfig": {
                      "temperature": 0.95,
                      "responseMimeType": "application/json"
                  }
              }

              response = requests.post(
                  url,
                  json=payload,
                  timeout=180
              )

              response.raise_for_status()

              data = response.json()

              text = (
                  data["candidates"][0]
                  ["content"]["parts"][0]["text"]
              )

              text = (
                  text.replace("```json", "")
                  .replace("```", "")
                  .strip()
              )

              return json.loads(text)


          def pollinations_image(prompt, filename):
              full_prompt = prompt + """

              Photorealistic cinematic image.
              Vertical 9:16 composition.
              Same young rhesus macaque monkey character.
              Brown-grey realistic fur.
              Expressive dark eyes.
              Small rounded ears.
              Realistic monkey proportions.
              Funny facial expression.
              Funny but believable situation.
              Cinematic lighting.
              Detailed environment.
              Family friendly.
              No text.
              No logo.
              No watermark.
              """

              encoded = quote(full_prompt, safe="")

              url = (
                  "https://gen.pollinations.ai/image/"
                  + encoded
              )

              params = {
                  "model": "flux",
                  "width": 720,
                  "height": 1280
              }

              headers = {
                  "Authorization": "Bearer " + POLLINATIONS_KEY
              }

              for attempt in range(3):
                  try:
                      response = requests.get(
                          url,
                          params=params,
                          headers=headers,
                          timeout=240
                      )

                      response.raise_for_status()

                      content_type = (
                          response.headers.get(
                              "content-type",
                              ""
                          ).lower()
                      )

                      if "image" not in content_type:
                          raise RuntimeError(
                              "Pollinations did not return an image."
                          )

                      filename.write_bytes(response.content)

                      return

                  except Exception:
                      if attempt == 2:
                          raise

                      time.sleep(5)


          async def make_voice(text, filename):
              voice = edge_tts.Communicate(
                  text,
                  "hi-IN-MadhurNeural",
                  rate="+3%",
                  pitch="+0Hz"
              )

              await voice.save(str(filename))


          def get_daily_topic():
              pakistan_now = datetime.now(
                  ZoneInfo("Asia/Karachi")
              )

              day_number = pakistan_now.date().toordinal()

              topic = TOPICS[
                  day_number % len(TOPICS)
              ]

              return topic, pakistan_now


          def main():

              topic, pakistan_now = get_daily_topic()

              print("========================================")
              print("PAKISTAN DATE:", pakistan_now.strftime("%Y-%m-%d"))
              print("TODAY'S TRADING TOPIC:", topic)
              print("========================================")

              story_prompt = f"""
              Create ONE original funny wholesome YouTube Shorts story.

              TODAY'S FIXED TRADING TOPIC:
              {topic}

              The video must teach this trading topic in a simple,
              entertaining and memorable way.

              Main character:
              The SAME young rhesus macaque monkey in every scene.

              Character:
              brown-grey fur,
              expressive dark eyes,
              small rounded ears,
              realistic proportions,
              slightly mischievous face.

              STORY STYLE:
              Very funny.
              Cute monkey comedy.
              Strong hook at the beginning.
              A funny mistake or misunderstanding.
              Then a simple trading lesson.
              End with a memorable lesson.

              IMPORTANT:
              This is educational content only.

              Do NOT give:
              guaranteed profit,
              guaranteed winning strategy,
              100 percent accuracy claims,
              direct buy or sell signals,
              fake financial promises,
              fake expert claims.

              Do not tell viewers to buy or sell any specific coin,
              stock or financial product.

              LANGUAGE RULE:

              Narration MUST be written completely in natural Urdu script.

              Use Urdu alphabet such as:
              "بندر نے آج ایک عجیب غلطی کر دی"

              Do NOT write narration in Roman Urdu.

              Do NOT write narration in English.

              The narration should sound natural when spoken
              by a clear Hindi/Urdu voice.

              Title should be catchy and related to trading.
              Title can contain simple English trading words if useful.

              Description should be in Urdu with simple trading terms.

              Create exactly 6 scenes.

              Each scene should last exactly 5 seconds.

              Total narration should be short enough for about 25 to 30 seconds.

              Narration should be around 65 to 80 Urdu words.

              VISUAL PROMPTS:
              Visual prompts may be written in English.
              They must clearly describe the funny monkey action.
              Do not put text inside images.

              Return ONLY valid JSON.

              Required JSON:

              {{
                "title": "...",
                "description": "...",
                "narration": "...",
                "hashtags": [
                  "...",
                  "...",
                  "...",
                  "...",
                  "..."
                ],
                "tags": [
                  "...",
                  "...",
                  "...",
                  "..."
                ],
                "scenes": [
                  {{
                    "visual_prompt": "...",
                    "duration": 5
                  }},
                  {{
                    "visual_prompt": "...",
                    "duration": 5
                  }},
                  {{
                    "visual_prompt": "...",
                    "duration": 5
                  }},
                  {{
                    "visual_prompt": "...",
                    "duration": 5
                  }},
                  {{
                    "visual_prompt": "...",
                    "duration": 5
                  }},
                  {{
                    "visual_prompt": "...",
                    "duration": 5
                  }}
                ]
              }}
              """

              story = gemini_text(story_prompt)

              title = str(
                  story.get("title", "")
              ).strip()

              description = str(
                  story.get("description", "")
              ).strip()

              narration = str(
                  story.get("narration", "")
              ).strip()

              hashtags = story.get(
                  "hashtags",
                  []
              )

              tags = story.get(
                  "tags",
                  []
              )

              scenes = story.get(
                  "scenes",
                  []
              )

              if not title:
                  raise RuntimeError(
                      "Gemini returned an empty title."
                  )

              if not narration:
                  raise RuntimeError(
                      "Gemini returned empty narration."
                  )

              if len(scenes) != 6:
                  raise RuntimeError(
                      "Gemini did not return exactly 6 scenes."
                  )

              urdu_count = sum(
                  1
                  for char in narration
                  if "\u0600" <= char <= "\u06ff"
              )

              if urdu_count < 20:
                  raise RuntimeError(
                      "Narration is not sufficiently Urdu script."
                  )

              print("TITLE:")
              print(title)

              print("NARRATION:")
              print(narration)

              image_files = []

              for index, scene in enumerate(scenes):
                  filename = OUT / f"scene_{index + 1}.png"

                  print(
                      f"Generating image {index + 1} of 6..."
                  )

                  pollinations_image(
                      str(scene["visual_prompt"]),
                      filename
                  )

                  image_files.append(filename)

              audio_file = OUT / "voice.mp3"

              print("Creating clear Hindi/Urdu voice...")

              asyncio.run(
                  make_voice(
                      narration,
                      audio_file
                  )
              )

              clips = []

              for index, image in enumerate(image_files):
                  clip = OUT / f"clip_{index + 1}.mp4"

                  print(
                      f"Creating video clip {index + 1} of 6..."
                  )

                  run([
                      "ffmpeg",
                      "-y",
                      "-loop",
                      "1",
                      "-i",
                      str(image),
                      "-t",
                      "5",
                      "-vf",
                      "scale=720:1280,"
                      "zoompan="
                      "z='min(zoom+0.0015,1.08)':"
                      "x='iw/2-(iw/zoom/2)':"
                      "y='ih/2-(ih/zoom/2)':"
                      "d=150:"
                      "s=720x1280",
                      "-r",
                      "30",
                      "-pix_fmt",
                      "yuv420p",
                      "-an",
                      str(clip)
                  ])

                  clips.append(clip)

              concat_file = OUT / "concat.txt"

              with open(
                  concat_file,
                  "w",
                  encoding="utf-8"
              ) as file:
                  for clip in clips:
                      file.write(
                          f"file '{clip.resolve()}'\n"
                      )

              video_file = OUT / "monkey_trading_short.mp4"

              print("Combining video and Urdu voice...")

              run([
                  "ffmpeg",
                  "-y",
                  "-f",
                  "concat",
                  "-safe",
                  "0",
                  "-i",
                  str(concat_file),
                  "-i",
                  str(audio_file),
                  "-c:v",
                  "libx264",
                  "-c:a",
                  "aac",
                  "-shortest",
                  "-pix_fmt",
                  "yuv420p",
                  "-movflags",
                  "+faststart",
                  str(video_file)
              ])

              fixed_hashtags = (
                  "#Trading "
                  "#TradingUrdu "
                  "#TradingEducation "
                  "#TradingPsychology "
                  "#RiskManagement "
                  "#Shorts"
              )

              clean_hashtags = []

              for hashtag in hashtags:
                  hashtag = str(
                      hashtag
                  ).strip()

                  if hashtag:
                      if not hashtag.startswith("#"):
                          hashtag = "#" + hashtag

                      if hashtag not in clean_hashtags:
                          clean_hashtags.append(
                              hashtag
                          )

              hashtag_text = " ".join(
                  clean_hashtags[:8]
              )

              final_description = (
                  description
                  + "\n\n"
                  + hashtag_text
                  + "\n"
                  + fixed_hashtags
              )

              final_tags = [
                  "trading",
                  "trading education",
                  "trading urdu",
                  "trading psychology",
                  "risk management",
                  "monkey trading",
                  "funny monkey",
                  "trading shorts",
                  "shorts"
              ]

              for tag in tags:
                  tag = str(tag).strip()

                  if tag and tag not in final_tags:
                      final_tags.append(tag)

              credentials = Credentials(
                  None,
                  refresh_token=REFRESH_TOKEN,
                  token_uri="https://oauth2.googleapis.com/token",
                  client_id=CLIENT_ID,
                  client_secret=CLIENT_SECRET
              )

              print("Refreshing YouTube login...")

              credentials.refresh(
                  Request()
              )

              youtube = build(
                  "youtube",
                  "v3",
                  credentials=credentials
              )

              body = {
                  "snippet": {
                      "title": title[:100],
                      "description": final_description,
                      "tags": final_tags[:40],
                      "categoryId": "24"
                  },
                  "status": {
                      "privacyStatus": "public",
                      "selfDeclaredMadeForKids": False
                  }
              }

              print("Uploading video to YouTube...")

              media = MediaFileUpload(
                  str(video_file),
                  mimetype="video/mp4",
                  resumable=True
              )

              upload_request = youtube.videos().insert(
                  part="snippet,status",
                  body=body,
                  media_body=media
              )

              response = upload_request.execute()

              video_id = response["id"]

              print("========================================")
              print("SUCCESS!")
              print("YouTube video ID:", video_id)
              print(
                  "YouTube URL:",
                  "https://www.youtube.com/watch?v="
                  + video_id
              )
              print("========================================")


          if __name__ == "__main__":
              main()
          PY

          python bot.py

      - name: Save generated files
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: monkey-trading-youtube-output
          path: output/
          if-no-files-found: warn
