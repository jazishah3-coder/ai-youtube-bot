name: AI YouTube Bot

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

jobs:
  daily:
    runs-on: ubuntu-latest

    steps:
      - name: Test Gemini AI
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          RESPONSE=$(curl -s \
            -H "Content-Type: application/json" \
            -X POST \
            "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=$GEMINI_API_KEY" \
            -d '{
              "contents": [{
                "parts": [{
                  "text": "Write one short viral YouTube video topic in one sentence."
                }]
              }]
            }')

          echo "$RESPONSE"

      - name: Bot completed
        run: |
          echo "AI YouTube Bot is working!"
          date
