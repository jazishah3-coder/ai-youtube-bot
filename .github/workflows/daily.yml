name: AI YouTube Monkey Shorts

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install requests edge-tts google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib

      - name: Create and upload video
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}

        run: |
          cat > bot.py <<'PY'
          import os
          import json
          import asyncio
          import subprocess
          from pathlib import Path
          from urllib.parse import quote

          import requests
          import edge_tts

          from google.oauth2.credentials import Credentials
          from google.auth.transport.requests import Request
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload


          GEMINI_KEY = os.environ["GEMINI_API_KEY"]
          POLLINATIONS_KEY = os.environ["POLLINATIONS_API_KEY"]

          CLIENT_ID = os.environ["YOUTUBE_CLIENT_ID"]
          CLIENT_SECRET = os.environ["YOUTUBE_CLIENT_SECRET"]
          REFRESH_TOKEN = os.environ["YOUTUBE_REFRESH_TOKEN"]

          TEXT_MODEL = "gemini-3.5-flash-lite"

          OUT = Path("output")
          OUT.mkdir(exist_ok=True)


          def run(cmd):
              subprocess.run(cmd, check=True)


          def gemini_text(prompt):

              url = (
                  "https://generativelanguage.googleapis.com/v1beta/models/"
                  + TEXT_MODEL
                  + ":generateContent?key="
                  + GEMINI_KEY
              )

              payload = {
                  "contents": [
                      {
                          "parts": [
                              {
                                  "text": prompt
                              }
                          ]
                      }
                  ],
                  "generationConfig": {
                      "temperature": 0.9,
                      "responseMimeType": "application/json"
                  }
              }

              r = requests.post(
                  url,
                  json=payload,
                  timeout=180
              )

              r.raise_for_status()

              data = r.json()

              text = (
                  data["candidates"][0]
                  ["content"]["parts"][0]["text"]
              )

              return json.loads(
                  text.replace("```json", "")
                      .replace("```", "")
                      .strip()
              )


          def pollinations_image(prompt, filename):

              full_prompt = prompt + """
              Photorealistic cinematic image.
              Vertical 9:16 composition.
              Realistic monkey fur.
              Natural human-like emotions.
              Detailed environment.
              Natural cinematic lighting.
              No text.
              No logo.
              No watermark.
              """

              encoded = quote(full_prompt, safe="")

              url = (
                  "https://gen.pollinations.ai/image/"
                  + encoded
              )

              params = {
                  "model": "flux",
                  "width": 720,
                  "height": 1280
              }

              headers = {
                  "Authorization":
                      "Bearer " + POLLINATIONS_KEY
              }

              for attempt in range(3):

                  try:

                      r = requests.get(
                          url,
                          params=params,
                          headers=headers,
                          timeout=240
                      )

                      r.raise_for_status()

                      content_type = (
                          r.headers.get(
                              "content-type",
                              ""
                          ).lower()
                      )

                      if "image" not in content_type:
                          raise RuntimeError(
                              "Pollinations did not return an image."
                          )

                      filename.write_bytes(r.content)

                      return

                  except Exception:

                      if attempt == 2:
                          raise

                      import time
                      time.sleep(5)


          async def make_voice(text, filename):

              voice = edge_tts.Communicate(
                  text,
                  "ur-PK-AsadNeural",
                  rate="+5%"
              )

              await voice.save(str(filename))


