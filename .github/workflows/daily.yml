name: AI YouTube Monkey Trading Shorts

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install requests edge-tts google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib

      - name: Create and upload video
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}

        run: |
          cat > bot.py <<'PY'
          import os
          import json
          import asyncio
          import subprocess
          import time
          from pathlib import Path
          from urllib.parse import quote
          from datetime import datetime
          from zoneinfo import ZoneInfo

          import requests
          import edge_tts

          from google.oauth2.credentials import Credentials
          from google.auth.transport.requests import Request
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload


          GEMINI_KEY = os.environ["GEMINI_API_KEY"]
          POLLINATIONS_KEY = os.environ["POLLINATIONS_API_KEY"]

          CLIENT_ID = os.environ["YOUTUBE_CLIENT_ID"]
          CLIENT_SECRET = os.environ["YOUTUBE_CLIENT_SECRET"]
          REFRESH_TOKEN = os.environ["YOUTUBE_REFRESH_TOKEN"]

          TEXT_MODEL = "gemini-3.5-flash-lite"

          OUT = Path("output")
          OUT.mkdir(exist_ok=True)


          TOPICS = [
              "Support aur Resistance",
              "Trend ko pehchan-na",
              "Candlestick basics",
              "Stop Loss",
              "Take Profit",
              "Risk Reward Ratio",
              "Risk Management",
              "Position Sizing",
              "FOMO",
              "Revenge Trading",
              "Overtrading",
              "Trading Psychology",
              "Patience in Trading",
              "Trading Plan",
              "Trading Journal",
              "Breakout",
              "Fake Breakout",
              "Pullback",
              "Retest",
              "Liquidity",
              "Liquidity Sweep",
              "Volume",
              "Moving Average",
              "RSI",
              "MACD",
              "Market Structure",
              "Higher High aur Higher Low",
              "Lower High aur Lower Low",
              "Trendline",
              "Range Market",
              "Consolidation",
              "Entry Confirmation",
              "Multiple Timeframes",
              "Leverage ka Risk",
              "Liquidation",
              "Margin",
              "Spot aur Futures ka farq",
              "Risk per Trade",
              "Win Rate aur Risk Reward",
              "Slippage",
              "Spread",
              "Fear aur Greed",
              "Trading Discipline",
              "News ke waqt Trading",
              "Volatility",
              "Divergence",
              "Scalping",
              "Swing Trading",
              "Backtesting",
              "Paper Trading",
              "Capital Protection",
              "Trading Checklist",
              "Trading Session",
              "Order Block basics",
              "Fair Value Gap basics",
              "Market Psychology",
              "Bad Entry ki Galti",
              "Late Entry ki Galti",
              "Stop Loss ko samajhna",
              "Profit ko protect karna",
              "Loss ko accept karna",
              "Trading mein sabr"
          ]


          def run(cmd):
              subprocess.run(cmd, check=True)


          def gemini_text(prompt):

              url = (
                  "https://generativelanguage.googleapis.com/v1beta/models/"
                  + TEXT_MODEL
                  + ":generateContent?key="
                  + GEMINI_KEY
              )

              payload = {
                  "contents": [
                      {
                          "parts": [
                              {
                                  "text": prompt
                              }
                          ]
                      }
                  ],
                  "generationConfig": {
                      "temperature": 0.95,
                      "responseMimeType": "application/json"
                  }
              }

              last_error = None

              for attempt in range(3):

                  try:
                      response = requests.post(
                          url,
                          json=payload,
                          timeout=180
                      )

                      response.raise_for_status()

                      data = response.json()

                      text = (
                          data["candidates"][0]
                          ["content"]["parts"][0]["text"]
                      )

                      text = (
                          text.replace("```json", "")
                          .replace("```", "")
                          .strip()
                      )

                      return json.loads(text)

                  except Exception as e:

                      last_error = e

                      print(
                          f"Gemini attempt {attempt + 1}/3 failed:",
                          e
                      )

                      if attempt < 2:
                          time.sleep(5)

              raise RuntimeError(
                  f"Gemini failed after 3 attempts: {last_error}"
              )


          def pollinations_image(prompt, filename):

              full_prompt = prompt + """

              Photorealistic cinematic image.
              Vertical 9:16 composition.
              Same young rhesus macaque monkey character.
              Brown-grey realistic fur.
              Expressive dark eyes.
              Small rounded ears.
              Realistic monkey proportions.
              Funny facial expression.
              Funny but believable situation.
              Cinematic lighting.
              Detailed environment.
              Family friendly.
              No text.
              No logo.
              No watermark.
              """

              encoded = quote(
                  full_prompt,
                  safe=""
              )

              url = (
                  "https://gen.pollinations.ai/image/"
                  + encoded
              )

              params = {
                  "model": "flux",
                  "width": 720,
                  "height": 1280
              }

              headers = {
                  "Authorization": "Bearer " + POLLINATIONS_KEY
              }

              for attempt in range(3):

                  try:

                      print(
                          f"Pollinations image attempt "
                          f"{attempt + 1}/3..."
                      )

                      response = requests.get(
                          url,
                          params=params,
                          headers=headers,
                          timeout=240
                      )

                      response.raise_for_status()

                      content_type = (
                          response.headers.get(
                              "content-type",
                              ""
                          ).lower()
                      )

                      if "image" not in content_type:
                          raise RuntimeError(
                              "Pollinations did not return an image."
                          )

                      filename.write_bytes(
                          response.content
                      )

                      if filename.stat().st_size < 1000:
                          raise RuntimeError(
                              "Generated image file is too small."
                          )

                      print(
                          "Image created:",
                          filename
                      )

                      return

                  except Exception as e:

                      print(
                          "Image generation failed:",
                          e
                      )

                      if attempt < 2:
                          time.sleep(5)

              raise RuntimeError(
                  f"Pollinations failed for {filename}"
              )


          async def make_voice(text, filename):

              print(
                  "Finding available Urdu/Hindi voices..."
              )

              try:

                  voices = await edge_tts.list_voices()

                  available = [
                      v["ShortName"]
                      for v in voices
                      if v.get("Locale") in [
                          "ur-PK",
                          "hi-IN"
                      ]
                  ]

                  print(
                      "Available Urdu/Hindi voices:",
                      available
                  )

              except Exception as e:

                  print(
                      "Could not list voices:",
                      e
                  )

                  available = []


              preferred = [
                  "ur-PK-UzmaNeural",
                  "ur-PK-AsadNeural",
                  "hi-IN-MadhurNeural",
                  "hi-IN-SwaraNeural"
              ]


              voice_list = []


              for voice in preferred:

                  if (
                      voice in available
                      and voice not in voice_list
                  ):
                      voice_list.append(voice)


              for voice in available:

                  if voice not in voice_list:
                      voice_list.append(voice)


              for voice in preferred:

                  if voice not in voice_list:
                      voice_list.append(voice)


              if not voice_list:

                  raise RuntimeError(
                      "No Urdu/Hindi TTS voice available."
                  )


              last_error = None


              for voice_name in voice_list:

                  for attempt in range(3):

                      try:

                          print(
                              f"Trying voice: {voice_name} "
                              f"(attempt {attempt + 1}/3)"
                          )

                          filename.unlink(
                              missing_ok=True
                          )

                          communicate = edge_tts.Communicate(
                              text,
                              voice_name,
                              rate="+3%",
                              pitch="+0Hz"
                          )

                          await communicate.save(
                              str(filename)
                          )

                          if (
                              filename.exists()
                              and filename.stat().st_size > 1000
                          ):

                              print(
                                  "Voice created successfully:",
                                  voice_name
                              )

                              return

                          raise RuntimeError(
                              "Audio file was not created properly."
                          )

                      except Exception as e:

                          last_error = e

                          print(
                              f"Voice failed: "
                              f"{voice_name}: {e}"
                          )

                          await asyncio.sleep(3)


              raise RuntimeError(
                  f"All Urdu/Hindi voices failed: {last_error}"
              )


          def get_daily_topic():

              pakistan_now = datetime.now(
                  ZoneInfo("Asia/Karachi")
              )

              day_number = (
                  pakistan_now.date().toordinal()
              )

              topic = TOPICS[
                  day_number % len(TOPICS)
              ]

              return topic, pakistan_now


          def main():

              topic, pakistan_now = get_daily_topic()


              print("========================================")
              print(
                  "PAKISTAN DATE:",
                  pakistan_now.strftime("%Y-%m-%d")
              )
              print(
                  "TODAY'S TRADING TOPIC:",
                  topic
              )
              print("========================================")


              story_prompt = f"""

              Create ONE original funny wholesome
              YouTube Shorts story.

              TODAY'S FIXED TRADING TOPIC:
              {topic}

              The video must teach this trading topic
              in a simple, entertaining and memorable way.

              Main character:

              The SAME young rhesus macaque monkey
              in every scene.

              Character:

              brown-grey fur,
              expressive dark eyes,
              small rounded ears,
              realistic proportions,
              slightly mischievous face.

              STORY STYLE:

              Very funny.
              Cute monkey comedy.
              Strong hook at the beginning.
              A funny mistake or misunderstanding.
              Then a simple trading lesson.
              End with a memorable lesson.

              IMPORTANT:

              This is educational content only.

              Do NOT give:
              guaranteed profit,
              guaranteed winning strategy,
              100 percent accuracy claims,
              direct buy or sell signals,
              fake financial promises,
              fake expert claims.

              Do not tell viewers to buy or sell
              any specific coin, stock or financial product.

              LANGUAGE RULE:

              Narration MUST be written completely
              in natural Urdu script.

              Example:

              "بندر نے آج ایک عجیب غلطی کر دی"

              Do NOT write narration in Roman Urdu.

              Do NOT write narration in English.

              The narration should sound natural when spoken
              by a clear Hindi/Urdu voice.

              Title should be catchy and related to trading.

              Title can contain simple English trading words
              if useful.

              Description should be in Urdu
              with simple trading terms.

              Create exactly 6 scenes.

              Each scene should last exactly 5 seconds.

              Total narration should be short enough
              for about 25 to 30 seconds.

              Narration should be around 
