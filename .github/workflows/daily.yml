name: AI YouTube Bot

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

jobs:
  daily:
    runs-on: ubuntu-latest

    steps:
      - name: Test Gemini AI
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          RESPONSE=$(curl -s \
            -H "Content-Type: application/json" \
            -X POST \
            "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key=$GEMINI_API_KEY" \
            -d '{
              "contents": [{
                "parts": [{
                  "text": "Create one viral YouTube video idea and write a complete 60-90 second script. Choose a topic that is interesting, surprising, useful, or currently popular. Return only the topic title followed by the full narration script. Do not include camera directions, emojis, or explanations."
                }]
              }]
            }')

          echo "$RESPONSE"

      - name: Bot completed
        run: |
          echo "AI YouTube Bot is working!"
          date
